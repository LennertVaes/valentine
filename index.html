<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Will you be my Valentine?</title>
    <meta
      name="description"
      content="A little Valentine's note from across the miles."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
      <div class="hearts" id="floating-hearts"></div>
    </div>

    <main class="stage">
      <p class="eyebrow">from me, to you</p>
      <h1 class="title">Will you be my Valentine?</h1>
      <p class="subtitle">
        Miles apart, but my heart still finds its way to you.
      </p>

      <div class="actions" id="actions">
        <button type="button" class="btn btn-yes" id="yes-btn">Yes</button>
      </div>
    </main>

    <button type="button" class="btn btn-no" id="no-btn">No</button>

    <script src="script.js"></script>
  </body>
</html>
