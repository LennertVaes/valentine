<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're my Valentine</title>
    <meta
      name="description"
      content="Yay! You're my Valentine — distance never stood a chance."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
      <div class="hearts" id="floating-hearts"></div>
    </div>

    <main class="celebrate">
      <div class="celebrate-burst" aria-hidden="true"></div>
      <p class="eyebrow">best answer ever</p>
      <h1 class="title celebrate-title">Yay! You're my Valentine</h1>
      <p class="subtitle">
        Distance never stood a chance. Can't wait to celebrate with you —
        even if it's through a screen for now.
      </p>
      <div class="big-heart" aria-hidden="true"></div>
    </main>

    <script src="yes.js"></script>
  </body>
</html>
